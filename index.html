<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>من البلوتوث إلى الصوت</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#12201d;--mu:#62736f;--pr:#0f766e;--on:#fff;--bd:#dde5e2;--ok:#15803d;--er:#b91c1c;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#16201e;--tx:#e6f0ed;--mu:#8da39d;--pr:#2dd4bf;--on:#04201c;--bd:#263431;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
button.grow{flex:1}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px;width:100%}
#status{font-size:.95rem;color:var(--mu)}
#status.on{color:var(--ok)}#status.err{color:var(--er)}
#now{min-height:7.5rem;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2rem;font-weight:700;line-height:1.35;word-break:break-word}
#now.empty{font-size:1rem;font-weight:400;color:var(--mu)}
#raw{text-align:center;color:var(--mu);font-size:.9rem;min-height:1.4em;direction:ltr}
ul{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
li{padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;justify-content:space-between;align-items:center}
li small{color:var(--mu);direction:ltr;white-space:nowrap}
li button{min-height:36px;padding:4px 10px}
label{display:block;font-size:.9rem;color:var(--mu);margin:10px 0 4px}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:1rem;margin:8px 0}
.chk input{width:22px;height:22px;min-height:0}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.rule{display:grid;grid-template-columns:1fr 2fr auto;gap:6px;margin-bottom:6px}
.note{font-size:.85rem;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>من البلوتوث إلى الصوت</h1>

<div class="card">
  <div class="row">
    <button class="p grow" id="bBle">اتصال بلوتوث (BLE)</button>
    <button class="grow" id="bSer">اتصال HC-06 (كمبيوتر)</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="grow" id="bOff" disabled>قطع الاتصال</button>
  </div>
  <p id="status">غير متصل</p>
  <p class="note" id="support"></p>
</div>

<div class="card">
  <div id="now" class="empty">بانتظار الإشارة...</div>
  <div id="raw"></div>
  <div class="row" style="margin-top:10px">
    <button class="p grow" id="bSpeak">انطق الآن</button>
    <button class="grow" id="bStop">إيقاف الصوت</button>
  </div>
</div>

<div class="card">
  <div class="row">
    <input id="manual" placeholder="جرّب بدون جهاز: اكتب إشارة أو نصاً" style="flex:1">
    <button id="bTry" class="p">تجربة</button>
  </div>
</div>

<div class="card">
  <strong>السجل</strong>
  <ul id="log"></ul>
</div>

<div class="card">
  <details>
    <summary>الصوت والإعدادات</summary>
    <label class="chk"><input type="checkbox" id="auto" checked> نطق تلقائي عند وصول إشارة</label>
    <label class="chk"><input type="checkbox" id="rawToo" checked> انطق النص الخام إذا لا توجد قاعدة له</label>
    <label for="voice">الصوت</label><select id="voice"></select>
    <label for="rate">السرعة</label><input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1">
    <label for="baud">سرعة المنفذ التسلسلي (HC-06 على الكمبيوتر)</label>
    <select id="baud"><option>9600</option><option>4800</option><option>19200</option><option>38400</option><option>57600</option><option>115200</option></select>
  </details>
</div>

<div class="card">
  <details>
    <summary>تحويل الإشارة إلى نص</summary>
    <p class="note">اكتب ما يرسله Arduino (مثل 1 أو A) ثم النص الذي تريد أن يظهر ويُنطق. إن لم تضف قاعدة يُستخدم النص الوارد كما هو.</p>
    <div id="rules"></div>
    <button id="bAdd">إضافة قاعدة</button>
  </details>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const BLE_SERVICES = [0xFFE0, '6e400001-b5a3-f393-e0a9-e50e24dcca9e', 0xFFE5, 0xFFF0];
let rules = [], voices = [], pending = 0;
let bleDev = null, serPort = null, serReader = null, closing = false;
let buf = '', flushT = null;
const dec = new TextDecoder();

// ---------- تخزين القواعد
function load(){ try { rules = JSON.parse(localStorage.getItem('b2v_rules') || '[]'); } catch(e){ rules = []; }
  if(!rules.length) rules = [{m:'1',t:'الباب مفتوح'},{m:'0',t:'الباب مغلق'}]; }
function save(){ try { localStorage.setItem('b2v_rules', JSON.stringify(rules)); } catch(e){} }
function drawRules(){
  const box = $('rules'); box.innerHTML = '';
  rules.forEach((r,i)=>{
    const d = document.createElement('div'); d.className='rule';
    const a = document.createElement('input'); a.value=r.m; a.placeholder='الإشارة'; a.dir='ltr';
    const b = document.createElement('input'); b.value=r.t; b.placeholder='النص';
    const x = document.createElement('button'); x.textContent='حذف';
    a.oninput = ()=>{ r.m=a.value; save(); }; b.oninput = ()=>{ r.t=b.value; save(); };
    x.onclick = ()=>{ rules.splice(i,1); save(); drawRules(); };
    d.append(a,b,x); box.append(d);
  });
}
$('bAdd').onclick = ()=>{ rules.push({m:'',t:''}); save(); drawRules(); };

// ---------- الصوت
function loadVoices(){
  voices = speechSynthesis.getVoices();
  const sel = $('voice'); sel.innerHTML='';
  const sorted = [...voices].sort((a,b)=>(b.lang.startsWith('ar')) - (a.lang.startsWith('ar')));
  sorted.forEach(v=>{ const o=document.createElement('option'); o.value=v.voiceURI; o.textContent=v.name+' ('+v.lang+')'; sel.append(o); });
  if(!voices.length){ const o=document.createElement('option'); o.textContent='الصوت الافتراضي'; sel.append(o); }
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
else $('support').textContent = 'المتصفح لا يدعم تحويل النص إلى صوت.';

function speak(text){
  if(!('speechSynthesis' in window) || !text) return;
  if(pending > 8){ speechSynthesis.cancel(); pending = 0; }
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(x=>x.voiceURI === $('voice').value);
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'ar-SA'; }
  u.rate = parseFloat($('rate').value);
  pending++;
  u.onend = u.onerror = ()=>{ pending = Math.max(0, pending-1); };
  speechSynthesis.speak(u);
}
function unlockAudio(){ // يلزم تفاعل من المستخدم على الهاتف
  if('speechSynthesis' in window){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
}
$('bStop').onclick = ()=>{ speechSynthesis.cancel(); pending = 0; };
$('bSpeak').onclick = ()=>{ const t = $('now').dataset.text; if(t) speak(t); };

// ---------- معالجة الإشارة
function handle(rawText){
  const key = rawText.trim(); if(!key) return;
  const r = rules.find(x => x.m.trim() && x.m.trim().toLowerCase() === key.toLowerCase());
  const text = r ? r.t : ($('rawToo').checked ? key : '');
  const now = $('now');
  if(text){ now.textContent = text; now.dataset.text = text; now.className = ''; }
  $('raw').textContent = r ? 'الإشارة: ' + key : '';
  const li = document.createElement('li');
  const span = document.createElement('span'); span.textContent = text || key;
  const sm = document.createElement('small'); sm.textContent = new Date().toLocaleTimeString('en-GB');
  const rep = document.createElement('button'); rep.textContent = 'إعادة'; rep.onclick = ()=>speak(text || key);
  li.append(span, sm, rep); $('log').prepend(li);
  while($('log').children.length > 60) $('log').lastChild.remove();
  if(text && $('auto').checked) speak(text);
}
function feed(str){
  buf += str;
  const parts = buf.split(/[\r\n]+/); buf = parts.pop();
  parts.forEach(handle);
  clearTimeout(flushT);
  if(buf) flushT = setTimeout(()=>{ const b = buf; buf = ''; handle(b); }, 600);
}
$('bTry').onclick = ()=>{ unlockAudio(); const v = $('manual').value; if(v){ handle(v); $('manual').value=''; } };
$('manual').addEventListener('keydown', e=>{ if(e.key==='Enter') $('bTry').click(); });

// ---------- الحالة
function setStatus(t, cls){ const s=$('status'); s.textContent=t; s.className=cls||''; }
function setConnected(on){ $('bOff').disabled = !on; $('bBle').disabled = on; $('bSer').disabled = on; }

// ---------- BLE (أجهزة مثل HM-10 / ESP32 BLE)
$('bBle').onclick = async ()=>{
  unlockAudio();
  if(!navigator.bluetooth){ setStatus('هذا المتصفح لا يدعم Web Bluetooth. استخدم Chrome.', 'err'); return; }
  try{
    setStatus('اختر الجهاز...');
    bleDev = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:BLE_SERVICES});
    bleDev.addEventListener('gattserverdisconnected', ()=>{ if(!closing){ setStatus('انقطع الاتصال', 'err'); } setConnected(false); });
    setStatus('جارٍ الاتصال...');
    const server = await bleDev.gatt.connect();
    let ch = null;
    for(const s of BLE_SERVICES){
      try{
        const svc = await server.getPrimaryService(s);
        const chars = await svc.getCharacteristics();
        ch = chars.find(c=>c.properties.notify) || null;
        if(ch) break;
      }catch(e){}
    }
    if(!ch) throw new Error('لم أجد قناة استقبال في هذا الجهاز');
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', e=> feed(dec.decode(e.target.value, {stream:true})));
    closing = false; setConnected(true); setStatus('متصل بـ ' + (bleDev.name || 'الجهاز'), 'on');
  }catch(e){ setStatus('تعذّر الاتصال: ' + e.message, 'err'); setConnected(false); }
};

// ---------- Web Serial (HC-06 بعد إقرانه بالكمبيوتر)
$('bSer').onclick = async ()=>{
  unlockAudio();
  if(!('serial' in navigator)){ setStatus('Web Serial غير مدعوم هنا. استخدم Chrome أو Edge على الكمبيوتر.', 'err'); return; }
  try{
    serPort = await navigator.serial.requestPort();
    await serPort.open({baudRate: parseInt($('baud').value)});
    closing = false; setConnected(true); setStatus('متصل عبر المنفذ التسلسلي', 'on');
    readSerial();
  }catch(e){ setStatus('تعذّر الاتصال: ' + e.message, 'err'); setConnected(false); }
};
async function readSerial(){
  try{
    while(serPort && serPort.readable && !closing){
      serReader = serPort.readable.getReader();
      try{
        while(true){ const {value, done} = await serReader.read(); if(done) break; if(value) feed(dec.decode(value, {stream:true})); }
      } finally { serReader.releaseLock(); }
    }
  }catch(e){ if(!closing) setStatus('انقطع الاتصال: ' + e.message, 'err'); }
  setConnected(false);
}

// ---------- قطع
$('bOff').onclick = async ()=>{
  closing = true;
  try{ if(bleDev && bleDev.gatt.connected) bleDev.gatt.disconnect(); }catch(e){}
  try{ if(serReader) await serReader.cancel(); }catch(e){}
  try{ if(serPort){ await serPort.close(); } }catch(e){}
  bleDev = serPort = serReader = null; buf = '';
  setConnected(false); setStatus('غير متصل');
};

// ---------- تهيئة
(function init(){
  const hints = [];
  if(!navigator.bluetooth) hints.push('Web Bluetooth غير متاح في هذا المتصفح.');
  if(!('serial' in navigator)) hints.push('Web Serial غير متاح (يعمل على Chrome/Edge للكمبيوتر).');
  $('support').textContent = hints.join(' ');
  load(); drawRules();
})();
</script>
</body>
</html>
